                    text: `　その男は、私の耳もとで囁いた。

　――まさか。

この男は知っているのか。三十年近く、私が喉の奥に刺さった棘のように隠し続けてきた、あの忌まわしい出来事を。

　稽古を終えて荷をまとめようとした時、見覚えのない包みが紛れ込んでいるのに気づいた。

　当時、私のいた道場は、越中に名を馳せる黒田流の一派であった。

すぐに父へ、あるいは先生へ打ち明ければよかった。

　帰り道、山手の神社の裏手まで来た私は、人の気配がないのを確かめてから、震える手で包みを解いた。
現れたのは、息を呑むほど見事な拵えの短刀だった。ひと目で悟った。藩主から賜ったという、あの道場の家宝に違いなかった。
なぜその時、隠してしまったのか。

雪玉が坂を転がるように、事は取り返しのつかぬ深淵へ向かっていく。あの時の私は、まだそれを知らなかった。

                "2": {
                    title: "スピンオフ第二話：父の背中",
                    text: `　父の言葉が落ちると、道場の中はしんと静まり返った。

　父――佐一の眼光は鋭かった。

名乗り出ぬのか。今がその時ではないのか。

　私は腿の上で拳を固く握りしめていた。

――本家の主・黒田穂龍が、家宝の短刀を密かに売り払った。

　「物の値打ちなど、所詮は形あるものにすぎぬ。黒田流の真髄は、鋼を振るう者の心にある。短刀がどこへ行こうと、私の心はいささかも揺るがぬ」

　父は出る幕を失い、すべてがこのまま水に流れるようにも思われた。
だが、分家の辰之進が黙って引き下がるはずもなかった。
本家を失脚させる好機を、主の精神論ひとつで潰されてたまるものか――そう考えたのだろう。

　ある雪の降る夕暮れ、父は主の屋敷に呼び出された。
そこには、冷ややかな笑みを浮かべた辰之進が控えていた。

　「……一之介。お前はここにいろ」

  「すでに藩主様とは話がついておる」穂龍先生は穏やかに続けた。「この件は決着した。表向き、短刀は私の指示で処分されたことになっている」

                    title: "スピンオフ第四話：人間の嘘、その中にある真実",
                    text: `　私は本当にあの存在に出会い、そして首飾りを受け取った。
山奥の、普通の旅人が決して足を踏み入れぬほど深い場所に、それは棲んでいた。
それが本当は何であったのか、今でも私には分からない。
村人はそれを鬼と呼び、土地に降りかかるあらゆる災いの源として恐れていた。
私がそれを迎え撃つ者に選ばれたのは、必然だったのかもしれない。
私は剣術を修め、長年子どもたちに教えていた。危険に立ち向かう者がいるとすれば、私以上に適した者は少なかった。

  当時、村は長年の凶作に苦しんでいた。季節外れの嵐が収穫を台無しにし、山からは野獣が下りてきて田畑を荒らし、奇妙な虫の群れが異常に繁殖していた。人々は絶望していた。
そして私は――愚かにも、彼らの役に立てるという誇りを抱いていたのだ。

  二十年前、この町に流れてきた私に、最初に優しく声をかけてくれたのは彼だった。
今では寺の和尚となった彼が、私にとってかけがえのない存在になっていた。
若い頃は悪戯をして共に馬鹿なことで笑い合った。しかし、人生の岐路に立つとき、彼はいつも私の話に耳を傾け、そばにいてくれた。
鬼退治に向かう日も、彼は最後まで私の隣にいた。
あの男にだけは、嘘がつけなかった。
心のうちを語れる相手は、彼ひとりだった。

  山へ登る日、私は帰ってこられぬ気がしていた。
彼とも今生の別れになるのだと、覚悟していた。
私はあの短刀を彼に預けた。父の形見だから持っていてくれ、と。
彼は私の覚悟もろとも、それを受け取ってくれた。まったく、私はあの男に頭が上がらない。
だが、その和尚にすら、短刀の由来だけは話せなかった。
父の形見だ、と。それが、私が彼についた唯一の嘘だった。

  あれから二十年が過ぎた。
私は山から生還し、災いは収まった。
鬼など、もとよりいなかったのかもしれぬ。ただ自然の巡りがそうであっただけだ。
それでも私は、人々にこう告げた。
鬼は去った。だが祟りは残る。ゆえに山へ入ってはならぬ。祀らねばならぬ、と。
私はまた嘘をついた。
首飾りは、その嘘の象徴だった。
今度の嘘は、町のため、人々のため、そしてあの存在のための嘘だった。

  ある夜、私は和尚にだけ打ち明けた。
鬼などいなかったと。
そこにいたのは山の神、私は首飾りという呪いを授かったのだと。

  今、この山門の階段のふもと。
山と村の境界。
私の前に、この男が立っている。
黒田の息子。
私がこれまで抱えてきたすべての嘘の、最後の目撃者。
そしておそらく――すべての嘘が終わりを迎える前に、私が直面しなければならない最後の試練。`

                "1": {
                    title: "Spinoff Chapter One: The Heirloom Dagger",
                    text: `The man leaned close and whispered into my ear.

“You still have the heirloom dagger, do you not?”

—Impossible.

My heart lurched violently in my chest, and the blood drained from my fingertips.
Did this man know?
That accursed incident I had concealed for nearly thirty years—hidden like a splinter lodged deep in my throat.

Kuroda of Etchū.
The moment I heard the name, understanding finally dawned on me.
Not the main house of the school where I had once trained, but the branch family.
If so, how much did this man truly know?

I was nine years old when it happened.
How could I ever forget the day everything began to unravel?

My days had been filled with sword practice.
That day, as always, I had followed in the footsteps of my father, the senior instructor of the Kuroda school’s main dojo, training alongside the other disciples.
I had never been an especially gifted child.
Stubborn diligence—that was my only strength.
Even then, I believed with all the certainty a child could possess that one could not lie to the sword.

But disaster had already crept silently to my feet.

After practice, as I gathered my belongings to leave, I noticed an unfamiliar bundle tucked among them.
The instant I saw it, a chill ran the length of my spine.
I did not need to open it.
Something forbidden lay within.
I knew it with terrifying certainty.

In those days, the dojo where I trained belonged to a renowned branch of the Kuroda style, famous throughout Etchū Province.
Its master, Kuroda Suitatsu, was a man of integrity—disciplined, unpretentious, and deeply respected by the lord of the domain.
He valued not the worth of possessions, but the spirit of the people who carried them.
By contrast, the head of the branch family, Kuroda Tatsunoshin, was a man of undeniable skill but dangerous ambition.
He had long resented living in the shadow of the main house.
Looking back now, I am certain it was a trap laid by the branch family.
But what could a nine-year-old boy have understood of schemes and rivalries?

I should have gone straight to my father.
Or to Master Suitatsu.
That was all I had to do.
Why could I not?
For the first time in my life, I learned how fragile the core of my own character truly was.

On the way home, when I reached the shrine on the hillside and confirmed no one was nearby, I finally unwrapped the bundle with trembling hands.
Inside lay a dagger of breathtaking craftsmanship.
Its mountings gleamed with quiet magnificence.
The moment I saw it, I knew.
It had to be the treasured heirloom the domain lord had once bestowed upon the dojo.

Why did I hide it?
That regret has never ceased tormenting me.
Once an opportunity to set things right slips away, it never returns.
Like a snowball tumbling downhill, events gather weight until they rush toward a depth from which there is no return.
At the time, I did not yet know this.

I hid the dagger beneath the shrine’s wooden veranda, pressing it into the damp darkness below.

The days that followed were agony.
I could scarcely breathe.
Yet days passed, and no uproar came to the dojo.
No one spoke of anything being missing.
Foolishly, I even began to hope that perhaps everything would simply disappear into silence.
That perhaps this nightmare would somehow end without consequence.

The storm finally broke less than a month later.
My father, Saichi—the senior instructor—gathered the students together, his expression unusually grave.

“For some time now,” he said quietly, “something of importance has gone missing. If any of you know anything, no matter how small, you must speak. If you saw an unfamiliar face… if someone entrusted something to you… anything at all. Come to me.”

My father’s vision seemed to waver for just a brief moment.
In that instant, I felt my blood turn to ice.`
                },
                "2": {
                    title: "Spinoff Chapter Two: My Father’s Back",
                    text: `The moment my father's words settled over the dojo, silence descended.
Before long, the students began glancing nervously at one another, whispering in hushed voices.
Only I remained frozen, as though carved from stone.
My throat burned.
I could barely remember how to breathe.

My father, Saichi, stood with his usual sharp bearing.
Yet something in his eyes was different.
Behind their sternness lingered a sorrow so deep it seemed almost unbearable.
It felt as though he were deliberately avoiding my gaze.

He knows.
The certainty struck me at once.

Will you not step forward?
Will you not speak now, while there is still time?
Though he said nothing, it seemed his very back asked this of me.

I clenched my fists against my thighs.
A tremor rose from deep within me, shaking my body from the waist upward, and I fought desperately to suppress it.
The burden was too heavy for a nine-year-old child to bear.
Yet my greatest sin was not hiding the dagger.
It was betraying my father's trust—
and continuing to betray it, moment after moment.

When training ended, I fled the dojo as though escaping judgment itself.
The dagger hidden beneath the shrine seemed to gleam in the darkness like a curse, and fear rooted my feet to the earth.

That night, through the paper sliding doors of my room, I overheard the voices of my parents.

"...Ichinosuke has not been himself."
My mother's voice trembled.
My father remained silent for a long while before finally speaking.

"I know."
His voice was heavy.
"There has been word—a report that the dagger is in his possession. Tatsunoshin of the branch house whispered as much to me."

I stopped breathing.
Surely I had misheard.

"No... that cannot be. Why would our son—?"

"No," my father said quietly.
"The boy did not steal it. This is the branch family's doing."
He paused.
"But now he struggles against his own weakness. If he can overcome himself here, then the path of the sword may yet open before him. That is what I hope for."

There was no anger in his voice.
No disappointment.
Only an unwavering resolve, still and deep as a windless sea.

"I shall take responsibility."
A long silence followed.
"I will report to our master that it was I who removed the heirloom."

No.
I wanted to scream.
I wanted to leap from my bedding, throw myself at my father's feet, confess everything—
that I had done it, that I had hidden the dagger beneath the shrine.

But my body would not move.
It was as though I had been bound by invisible chains.
My mouth remained frozen shut.
The nine-year-old boy I had been listened instead to the whisper of a demon:
Your father already knows.
If this will settle the matter, then perhaps there is no need to speak now.
That was the moment I descended into hell.

The following morning, events took a strange turn.
A rumor spread through town like wildfire.

Master Kuroda Suitatsu of the main house has secretly sold the heirloom dagger.

The dojo erupted in turmoil.
To sell a treasured gift bestowed by the domain lord was an unforgivable disgrace for a warrior.
Yet Master Suitatsu himself accepted the rumor as though it were no more than wind through willow branches.

"The worth of objects," he said with a faint smile, "belongs only to things that can be held. The true essence of the Kuroda school resides in the hearts of those who wield the sword. Wherever the dagger may have gone, my spirit remains unmoved."
He neither defended himself nor sought the dagger's whereabouts.
Even the domain lord, it was said, admired his composure.

As expected of Suitatsu.

In the end, the punishment imposed upon him amounted to little more than a brief period of confinement.

My father lost his chance to step forward.
For a fleeting moment, it seemed everything might simply be allowed to fade away.
But Tatsunoshin of the branch house had no intention of retreating so easily.
Would he truly allow such a perfect opportunity to ruin the main house to vanish beneath noble words and lofty ideals?
Of course not.

One snowy evening, my father was summoned to our master's residence.
There, standing in quiet attendance, waited Tatsunoshin—
a cold smile resting upon his lips.

"...Ichinosuke. Stay here."
My father spoke without turning to face me.
Those few words were the last thing he ever said to me as the senior instructor of the Kuroda school.
And the sight of his back, disappearing beyond the doorway—
that became the final image I carried of him in that life.`
                },
                "3": {
                    title: "Spinoff Chapter Three: Fractures in the Dagger",
                    text: `My father, Saichi, disappeared slowly into the whiteness of falling snow, his back dissolving into the evening as though swallowed by winter itself.
Deep within our master's residence, the atmosphere was heavy with tension.
The low, lingering voice of Kuroda Tatsunoshin, head of the branch house, cut through the silence.

"Suitatsu-dono," he said, "you may have persuaded our lord with your lofty talk of spirit and virtue, but facts do not bend so easily. The one who took the heirloom dagger was none other than the son of the man you trust above all—your senior instructor, Saichi."

Hidden in the shadows near the veranda, I held my breath.
My fingers trembled uncontrollably.
Tatsunoshin revealed everything.
He claimed that after hiding the dagger beneath the shrine, I had been followed by his own son.
Every step I had taken.
Every cowardly choice.
All of it had been watched.

Master Suitatsu said nothing.
His silence possessed a strange immovability, like deep water untouched by wind.
Tatsunoshin, however, grew increasingly agitated.
Before them, my father pressed both fists against the tatami floor and bowed low.
The sight of him crushed me beneath a weight I could scarcely endure.

Terror.
Shame.
Disgust at my own weakness.

No.
Father is not the one at fault.
It was I who lacked courage.

I wanted to shout the words.
Yet my throat remained sealed shut.
No sound came.

At length, my father spoke.
"My son's wrongdoing is my own."
His voice was low and steady.
"There is no excuse to offer. I ask only this—that I may atone for bringing disgrace upon our house by taking my own life."

The moment the words take my own life left his lips, darkness swallowed my vision.
Tatsunoshin smiled. Only slightly. But I saw it.
This had been his aim from the beginning.
To shake the foundations of the main house.
To remove Saichi—the right hand of Master Suitatsu.
To stain forever the honor of the school itself.
Everything was unfolding precisely as he had intended.

Then, quietly, Master Suitatsu shook his head.
"Saichi," he said, "what purpose would your death serve?"
His gaze turned toward Tatsunoshin.
"The rumor that I sold the dagger... that was your doing, was it not?"
The room froze.
"And to place the dagger among a disciple's belongings—"
"T-that is absurd," Tatsunoshin interrupted sharply. "Baseless slander!"
For the first time, the smile vanished from his face.

Master Suitatsu had seen through everything.
The trap laid by the branch house.
The scheme to disgrace the main family.
Even the cruel use of a nine-year-old boy as a pawn.

"I have already spoken with our lord," Suitatsu continued calmly.
"The matter has been settled. Officially, the dagger was disposed of under my own instruction."
He paused. Then his eyes shifted.
Though hidden beyond the paper screen, I felt his gaze find me.

"...However."
His voice deepened.
"The truth remains that someone within this school removed the heirloom and chose to conceal it."
A long silence followed.
"As head of the Kuroda school, I cannot overlook such a thing."
My heart stopped.

"Saichi."
The next words changed my life forever.
"Take Ichinosuke and leave this province."

Exile.
For a warrior, to be cast out—to lose one's school, one's standing, one's home—was a humiliation little short of death.
And yet, hidden within those words was mercy.

"Tell the boy this," Master Suitatsu said quietly.
"That his father steps down beside his master, sharing responsibility for the dishonor placed upon this house."
He lowered his eyes.
"There is no need to bury the child beneath further stones of guilt."
"Even if they leave this school, let father and son continue their training."
"Let them devote themselves to the sword."

My father bowed deeply.
Something struck the tatami beneath him.
Whether it was melted snow carried in from outside, or tears, I never knew.

Several days later, before dawn, our family left Etchū with little more than what we could carry.
Through our master's connections, we were spared destitution and allowed to settle in a humble post town far from our former lives.

As for the dagger, my father quietly retrieved it from beneath the shrine.
Without a word, he hid it among our belongings, burying it at the bottom where no eyes would ever find it.
Not once did he blame me.

Ten years passed.
My father became a farmer.
I worked beside him in the fields while continuing my sword training.
My mother, worn down by hardship and an unfamiliar life, died young.
My father did not live much longer.

As death approached, he entrusted the dagger to me.
Do not carry it as a sin, he said.
Carry it as something from which to grow.

After that, I remained in the village.
I tilled the earth.
I taught children the sword.
Years passed peacefully enough, until misfortune cast its shadow upon the town.

And when that time came, I was no longer the frightened boy of nine.
I had grown old enough to face hardship as a trial through which I might finally honor my father.

And it was then
that I encountered the god of the mountain.`

                "4": {
                    title: "Spinoff Chapter Four: The Truth Within Human Lies",
                    text: `I did meet it.
And I did receive the necklace.
Something dwelled deep within the mountains, far beyond where any ordinary traveler dared venture.
Even now, I cannot say what it truly was.
The villagers called it an Oni.
They feared it as the source of every calamity that had befallen the land.

Perhaps it was inevitable that I would be chosen to confront it.
I had trained in the sword.
I had spent years teaching children.
If danger were to be met, there were few better suited.

At the time, the village had suffered through years of hardship.
Unseasonable storms ruined the harvests.
Wild beasts descended from the mountains to ravage the fields.
Strange swarms of insects multiplied beyond reason.
The people had grown desperate.
And I, perhaps foolishly, had taken pride in believing I might be of use to them.

When I first came to this town years ago, the first man to speak kindly to me had been him.
Now he was the head priest of the temple.
To me, he had become irreplaceable.
In our youth we had played pranks and laughed at foolish things.
Yet when life truly mattered, he had always listened.
He had always remained beside me.

Even on the day I departed to confront the Oni, he stayed with me until the very end.
He was the only man to whom I could never lie.
The only one before whom I could speak honestly of what lived inside my heart.

When I climbed the mountain, I believed I would never return.
I had already accepted that it would be our final farewell.
So I entrusted him with the dagger.
"My father's keepsake," I told him. "Keep it for me."
He accepted it, along with the weight of my resolve.

To this day, I owe him more than I can ever repay.
And yet, even to him, I could not speak of the dagger's true history.
I told him it was my father's keepsake.
That was the only lie I ever told him.

Twenty years passed.
I returned alive from the mountain.
The calamities faded.
Perhaps there had never been any Oni at all.
Perhaps nature had merely followed its own inscrutable course.

Even so, I told the villagers this:
"The Oni is gone. But its curse remains. No one must enter the mountain. It must be honored."

And so I lied again.
The necklace became the symbol of that lie.
But this time, it was a lie told for the village.
For its people.
And for the sake of the being that dwelled within the mountain.

One night, I confessed the truth to the priest alone.
"There was no Oni," I told him.
"What I encountered was the god of the mountain."
"And what I received was not a blessing..."
I touched the necklace.
"...but a curse."

And now, here, at the foot of the temple steps.
At the boundary between mountain and village.
Before me stands this man.
The son of Kuroda.
The final witness to every lie I have ever carried.
And perhaps, the last trial I must face before all lies come to their end.`
