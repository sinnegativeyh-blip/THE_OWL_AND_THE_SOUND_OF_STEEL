    <style>
        :root {
            --bg-color: #0b0f19;
            --text-color: #cbd5e1;
            --accent-color: #ff5722;
            --accent-glow: rgba(255, 87, 34, 0.4);
            --card-bg: #1a202c;
            --border-color: #2d3748;
            --mystic-color: #8b5cf6;
            --mystic-glow: rgba(139, 92, 246, 0.4);

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans JP", sans-serif;

            margin: 0;
            padding: 0;
            -webkit-font-smoothing: antialiased;
        }

        header {
            text-align: center;
            padding: 60px 20px;
            background: linear-gradient(to bottom, #111827, var(--bg-color));
            border-bottom: 1px solid var(--border-color);
        }

        .header-logo {
            max-width: 150px;
            margin-bottom: 20px;
            filter: drop-shadow(0 0 10px rgba(255,255,255,0.1));
        }

        h1 {
            font-size: 2.2rem;
            color: #ffffff;
            margin: 0 0 10px 0;
            letter-spacing: 0.05em;
            font-weight: 700;
        }

        .subtitle {
            font-size: 1.1rem;
            color: #9ca3af;
            margin: 0;
        }

        .lang-switch {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 30px;
        }

        .lang-btn {
            background-color: #111827;
            color: #9ca3af;
            border: 1px solid var(--border-color);
            padding: 8px 20px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9rem;
            transition: all 0.3s ease;
        }

        .lang-btn:hover {
            border-color: var(--accent-color);
            color: #ffffff;
        }

        main {
            max-width: 800px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        .nav-container {
            display: flex;
            justify-content: center;
            margin-bottom: 40px;
        }

        .tab-nav {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
            background-color: #111827;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            max-width: 100%;
        }

        .tab-btn {
            background: none;
            border: none;
            color: #9ca3af;
            padding: 10px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.95rem;
            font-weight: 600;
            transition: all 0.2s ease;
            white-space: nowrap;
        }

        .tab-btn:hover {
            color: #ffffff;
            background-color: rgba(255, 255, 255, 0.05);
        }

        .tab-btn.active {
            background-color: var(--accent-color);
            color: #ffffff;
            box-shadow: 0 0 12px var(--accent-glow);
        }

        .content-section {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 40px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        .story-title {
            font-size: 1.8rem;
            color: #ffffff;
            margin-top: 0;
            margin-bottom: 30px;
            padding-bottom: 15px;
            border-bottom: 2px solid var(--border-color);
            letter-spacing: 0.02em;
        }

        .password-overlay {
            background-color: #111827;
            border: 1px dashed var(--border-color);
            border-radius: 8px;
            padding: 40px 20px;
            text-align: center;
            margin: 20px 0;
        }

        .password-overlay h3 {
            color: #ffffff;
            margin-top: 0;
            margin-bottom: 20px;
            font-size: 1.2rem;
        }

        .password-form {
            display: flex;
            justify-content: center;
            gap: 10px;
            max-width: 400px;
            margin: 0 auto;
        }

        .password-input {
            flex: 1;
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            color: #ffffff;
            padding: 12px 16px;
            border-radius: 6px;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.3s;
        }

        .password-input:focus {
            border-color: var(--accent-color);
        }

        .password-submit {
            background-color: var(--accent-color);
            color: #ffffff;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
            box-shadow: 0 0 8px var(--accent-glow);
        }

        .password-submit:hover {
            opacity: 0.9;
        }

        .error-message {
            color: #ef4444;
            margin-top: 15px;
            font-size: 0.95rem;
            font-weight: 600;
            display: none;
        }

        .protected-content {
            display: none;
        }

        .sub-section-title {
            font-size: 1.3rem;
            color: #ffffff;
            margin-top: 40px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .sub-section-title::before {
            content: "";
            display: inline-block;
            width: 4px;
            height: 18px;
            background-color: var(--accent-color);
            border-radius: 2px;
        }

        .video-container {
            position: relative;
            padding-bottom: 56.25%;
            height: 0;
            overflow: hidden;
            max-width: 100%;
            background-color: #000;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }

        .story-text {
            font-size: 1.1rem;
            color: var(--text-color);
            white-space: pre-wrap;
            word-wrap: break-word;
            background-color: #111827;
            padding: 30px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        /* 山の上のすみか専用装飾 */
        .mystic-title {
            color: #c084fc !important;
            border-bottom-color: var(--mystic-color) !important;
        }
        .mystic-border::before {
            background-color: var(--mystic-color) !important;
        }
        .mystic-submit {
            background-color: var(--mystic-color) !important;
            box-shadow: 0 0 8px rgba(139, 92, 246, 0.4) !important;
        }
        #input-mystic:focus {

        }

            text-align: center;
            padding: 40px 20px;
            color: #64748b;
            font-size: 0.9rem;
            border-top: 1px solid var(--border-color);
            margin-top: 60px;

                '8': { title: "第八話：錆びた闘心、剥き出しの牙", videoCode: "EzQZI-dl-nY", text: `　私は、この山に住まうふくろう。

                '10': { title: "第十話：雨の匂い、蘇る記憶の音", videoCode: "s_KI4H2szZM", text: `〈宿場町の鍛冶場〉

                '11': { title: "第十一話：自（おの）ずから然（しか）らむる法", videoCode: "uiUJW4voZ8M", text: `〈宿場町の鍛冶場〉

                    text: `Imagine a sound you have never heard before.
A sound more soothing than any other, one that makes the soul tremble—a sound that makes you want to let go of everything you have known, and simply surrender. That sound, the one I heard, changed everything.

...Hoo... Hoo...

I am the owl who dwells upon this mountain.
I awaken as the veil of night descends, and watch the ever-shifting flow of human life with a steady, silent gaze.
Our story begins when the air still hangs heavy with morning mist—begins with the sound of striking iron, a sound that wakes the mountain's silence, blunt as always, yet strangely tender.

Clang... Clang...

You can hear it too, can't you? That sound.

[The Honjin: An Inn for Great Lords]

In that moment, I could not even feel the coldness of the earth pressing through the soles of my tabi socks.

The conversation from the night before still lingered in my ears like standing water—my father, speaking of the marriage he had arranged.
"It is for your own happiness," he had said. The words had felt less like comfort than the final stroke of a hand shaping clay: the last touch needed to complete me as the daughter of the Honjin.

"I am going to the temple in your stead. Please see to the rest."

I left a single note behind and slipped out the back door just before the sixth hour of morning, as the first roosters began to crow. I was bound for the mountain temple, a place I visited once or twice a month to pray on the family's behalf. For a woman of my age, these proxy pilgrimages were meant to be a kind of debut—an occasion to wear a beautiful kimono, to walk with grace, to be seen fulfilling what was expected of me. But this morning was different. I wished only to take myself somewhere else.

To the east, the mountain wore a halo of light, shielding a sun not yet risen. In the west, a deep lapis blue still lingered. Where night and day merged, the boundary felt less like a line in the sky than a threshold between this world and the next. I left the main road for a side path, passed through the old graveyard, and the gentle slope gave way to a mountain trail. After a short climb, the stone stairway rose before me, straight and steep, leading to the temple.

The mountain was thick with mist, cold against the morning air. And then, from within that mist at the foot of the stairs, a familiar figure emerged.

Zuishin—the man the village called Ichinosuke.

"My, my. What manner of footsteps would dare disturb the mountain's silence at such an hour? If it isn't the young lady of the Honjin."

His voice carried its usual mocking lilt. Once hailed as the hero who slew a demon, he was known now only as the eccentric who haunted the mountain gate. Only the head priest still called him Zuishin. Over the years, this exchange at the foot of the stairs had become its own quiet custom between us.

"Master Zuishin. Please move. This morning, I do not wish to see anyone's face."

Zuishin watched over all who climbed this mountain, ensuring that none ventured too deep into its peaks. I did not know why—only that there were old rumors, some grievance from a past I had never been told. He stood before me now like the heavy doors of a temple gate, and did not move. He only studied my face, and let out a faint, powerless laugh. For one fleeting instant, I felt something shift behind his eyes.

"My lady... this will not do. Climb the mountain in that state, and you will surely call something dark down upon yourself. Still—very well. Only be careful. The mountain's poison runs strong."

He slipped away into the shadow of the path. I shook off his words and climbed.

The stairs were deserted. Cedar trees swallowed the sky, where darkness and light lay tangled together. And then—

—CLANG.

A sound sharp and crystalline cut through the air. It was not the temple bell, nor any human call. It was closer to a strike upon a gong—a sound that rang deep within my chest.

—CLANG. CLANG. CLANG.

The heavy mist that had clouded my heart seemed to lift in an instant. My soul was seized entirely by that sound. The agitation that had churned within me fell silent; my hurried steps lost their urgency and came to a halt of their own accord. As if drawn by an invisible thread, I left the path and was pulled toward its source.

Parting the tall grass, bypassing the old stairs, I came upon a small structure tucked into the shadows. Through its open door, I saw fire. Something struck against the sound again and again, sending sparks flying—vivid vermillion flashes against the cold blue of the dawn.

There stood the back of a man, his upper body bare, swinging a hammer with singular focus.

Zen, the field blacksmith. They said he had once worked in the town before retreating to live alone in the mountains. No one knew his true story. On my usual visits, I had only ever seen him as a man of few words, carrying soiled vegetables or bundles of firewood. I had never once given him a second thought.

But the man standing there was someone else entirely.

With every strike, the iron sang red, and the muscles of his arms rippled like water. In his profile there was a solitary dignity—the bearing of someone who flattered no one, and feared nothing. I forgot to breathe. Watching the muscles of his arm lash out along the boundary between fire and shadow, I felt the rhythm of that sound pulse deep within my ears.

Without turning, the man delivered one final strike.

—THUD.

It echoed with a heavy resonance. And in that moment, my body froze, as if turned to stone.`

                '2': { title: "Chapter 2: The Fruitless Bloom, The Spark of Awakening", videoCode: "iwjrjTcw2W4", text: `I am the owl who dwells upon this mountain.
The moon sinks, and the sky begins to pale. This is the far side of the boundary—the sacred threshold that must not be crossed.
A stray flower, once it has wandered in, can never return to its bud. What is done cannot be undone. Like steam rising from a pot. Like sparks flying from struck iron.

[The Base of the Mountain Gate: Zen's Forge]

The sound of iron striking iron rang through my body, and I was frozen, unable to move a single step. I forgot that my own feet were touching the ground at all. Even standing in the thicket, far from the entrance of the forge, I could feel the heat of the bursting sparks reach my skin.

He—the field blacksmith—left the glowing iron upon the anvil and turned, slowly, with absolute certainty, to take in my presence. The heat radiating from his back struck me like an invisible tide, pushing me away.

(...Leave.)

I heard no voice. And yet his back, the hammer in his grip, even the rising smoke—all of it spoke the same refusal.

I had wandered, without thinking, into a sanctuary no woman should enter. Now, like a young deer caught in a snare, I could do nothing but stand there, paralyzed. There was only a pure refusal in the air around him, the kind that tolerates no impurity.

He turned his head slowly, and his gaze found mine. Even through the dim shadow of the charcoal fire and the pale light of dawn, I could feel that gaze pierce straight through me. The morning sun, filtering through the gaps in the trees, was gathering strength, and in that light it seemed a flame had been lit behind his eyes as well.

It was not the appraising look the gentlemen of the inn gave me. It was not my father's gaze, with its mixture of affection and command. It was simply a light that looked upon things as they were. To him, my kimono meant nothing. My lineage meant nothing. My parents' expectations meant nothing. To him I was void—beyond evaluation.

My heart hammered in my ears, loud and intrusive. I could not move, could not apologize, could not flee. I felt a shame as though my bare self had been laid open to the world, and yet, struck by that strange and merciless light, I felt myself slipping into something near a trance.

How much time passed, I cannot say.

Once he had taken my presence in fully, he seemed to lose interest. He turned back to the anvil, raised his arm, and began to strike the iron once more.

—CLANG.

One strike. That was his signal: be gone. As if some spell had broken, I took one step back, then another, then turned and ran through the mist-covered grass without once looking behind me.

"...I told you, didn't I? The poison is strong."

What had that been? The eyes of that blacksmith had not looked upon me as the daughter of the Honjin. They had looked upon me. It felt as though my life—wrapped, until that morning, in the thin silk of routine—had been torn open by a single, ringing sound.

It should have frightened me. And yet, deep within my chest, a small flame of curiosity, unlike any I had known before, had caught, and begun to burn.

                '3': { title: "Chapter 3: The Faded Backdrop, The Only Truth", videoCode: "SHWoC3oBuV0", text: `I am the owl who dwells upon this mountain.
It is the nature of human beings that once they hear a single sound that makes the soul tremble, the garden they loved until yesterday looks suddenly like nothing more than the painted scenery of a playhouse.

"My lady, for your next pilgrimage, please wear this new garment—"

                '4': { title: "Chapter 4: The Sea of Grass, The Breath of the Earth", videoCode: "E5PL_G4mz5g", text: `Sunlight filtered through the canopy and fell upon the meadow like shimmering particles of light. The kaleidoscope of flowers and the vivid green of healthy grass gently unraveled the knots within my heart. The birdsong was kind to my ears; the scent of life rising from soil, grass, flower, and insect brought with it a profound sense of peace.

For a moment I was startled by the sound of my own voice. I realized my breathing itself had changed. It was no longer the thin, shallow breath I had drawn, again and again, in the depths of the Honjin, confined to my chest. It moved now in a smooth, full rhythm, as though I were drawing the coldness and the warmth of the earth up through the soles of my feet, waking every cell of my body in turn.

While I stood there, still caught in wonder, Zen-san walked on, his hand once again brushing the path through the wild green.

To me, this boundless landscape, and Zen-san moving through it, felt like one of the fairy tales my mother used to whisper at my bedside—or a daydream I once shaped for myself, staring at clouds along the riverbank. Even the sound of wind through the trees, which elsewhere could feel unsettling, here seemed a grand and welcoming chorus. Bees drifted from flower to flower; butterflies turned through the air; ladybirds crept through the grass below. Everything seemed to brim with some quiet joy.

For a long while I stood entranced in Zen-san's field, that beautiful Peach Blossom Spring, losing all sense of time.

I had no way, then, of knowing that Zuishin watched from the shadow of the trees behind me. Nor did I know why a young samurai once called Ichinosuke had become the man known as Zuishin—nor that the blacksmith named Zen was already hidden, somewhere, in the deepest folds of my own memory.

                '5': { title: "Chapter 5: The Abbot’s Beads, The God of the Mountain", videoCode: "Y1oXgLNnV3I", text: `I am the owl who dwells upon this mountain.
A temple draws the virtuous and the wicked in equal measure. It is the Abbot's duty to smooth over such chaos.
Today, those worn prayer beads of his will surely prove their worth.

[Front of the Buddhist Hall: The Mountain Temple]

"It is a fine day, is it not, Lady Toki?"

The Abbot's voice brought me back to myself. I had climbed the stone steps in something of a daze. Quietly, I set the furoshiki bundle of Zen-san's vegetables at the corner of the stairs and passed through the mountain gate, where the Abbot stood waiting. During my monthly pilgrimages he always offered me gracious sermons, and listened kindly to whatever news I brought of my daily life. To me, he was the most comforting presence I knew.

"Good day to you, Abbot."

"Ho, Lady Toki. Has something pleasant happened? Your voice carries like a bird's today, and your breath moves with unusual clarity."

I felt my cheeks flush. Embarrassed by his keen eye, I lowered my gaze without meaning to.

"Ha ha ha—very well. It must be proof that your coming marriage is a fortunate match. The Honjin remains secure. That is a relief to us all."

"...No, Abbot. It is not about the marriage."

"Oh? Then what might it be?"

"Abbot—you know Zen-san, the field blacksmith, do you not? I have only just come from his field."

The Abbot's gentle smile flickered, and stilled. His eyes took on a quiet light, as though peering into some deep abyss.

"I see. So you went to Zen's place. ...Lady Toki, the water of the mountain runs deeper than that of the village. At times it proves too strong for those who come from the lowlands."

His words struck me with a powerful sense of having heard them before. They were nearly the same words Zuishin had used: the mountain's poison is strong.

"You speak just as Master Zuishin does, Abbot."

"Indeed—Zuishin. He is a man who was overwhelmed long ago by that very water. For thirty years now it has been eroding him from within. Lady Toki... perhaps you have been called by the two of them."

Before I could ask what he meant, the Abbot turned and beckoned me inside without a word.

At the end of the stone path beyond the gate stood the solemn Buddhist Hall. The Abbot set his geta at the edge of the stairs, and I followed, lining up my own sandals beside his. We climbed together to the main entrance. Beneath the long, overhanging eaves, the warm sunlight was cut away, and a cool breeze brushed against my neck. Inside the dim hall, the Abbot bowed before the Shakyamuni Buddha enshrined at the center of the wooden floor, then led me out through a side door to a corner of the veranda overlooking the rock garden and the mountain beyond. The scent of incense lingered in the air; the boards felt cool beneath me. The Abbot began to speak, his eyes on the distant mountain range.

"Zen appeared in this town out of nowhere, not long before you were born. At first he could not speak our language, and knew nothing of human custom. And yet in time he learned our ways, earned our trust, and folded himself into the life of the town. But after some years had passed, those who envied him began to appear. Some sought to deceive him. Others, in the end, sought only to use him. He left the town of his own will, and withdrew into the foothills of this mountain. Many mourned his going. ...Zen chose the water of the mountain over the water of the town."

I stared down at the raked patterns of the rock garden, turning his strange fate over in my mind.

"And then there is Zuishin—Ichinosuke. He and I have been companions since we were boys. He was always a timid one, too gentle even to kill an insect. That such a man should become peerless once he took up a sword—heaven's design can be a strange and bitter irony."

"...Then the stories of the demon-slaying?"

"Yes—that happened when Zuishin and I were both still young. Misfortune had begun to haunt the town, and rumor laid the blame on a demon. It was decided that a skilled warrior should be sent to destroy it, and Ichinosuke was the one chosen. Too timid to refuse, he was pushed forward by the very people who knew his weakness best. To save the town, he climbed the mountain prepared to die. And yet—what do you imagine happened? Not five days had passed before he returned, carrying a necklace as proof the demon was slain. The misfortunes ceased from that day on, and he became a hero. ...But I could never quite bring myself to believe it."

The Abbot paused there, and let out a long, deep breath.

"One night, Ichinosuke came to me, trembling, and confessed everything. There had been no demon. There had only been the Mountain God. The necklace was not something he had taken—it was a curse that had been given to him.""

                '6': { title: "Chapter 6: The Marrow of Truth, The Cage of Roles", videoCode: "nYY1XH4gOQQ", text: `[The Veranda of the Buddhist Hall]
"I gave him the name 'Zuishin' as his Buddhist name. It means 'The Marrow of the Soul,' or 'The Core of Truth.' Lies in the mundane world—the Shaba—are simply human nature. I told him that once he entered the priesthood, such things would be unnecessary. I told him to cast them aside. I said, 'Ichinosuke is dead; from now on, live your Truth.' In the end, he settled by the side of those stone steps. He turned the mountain into forbidden ground, ensuring no soul ventured into its depths, as if he were feeding upon his own curse. And yet, I cannot believe that this... is his true 'Marrow'..."

Beyond the rock garden, birdsong echoed down from the mountain. The sinking sun was veiled now by thin clouds spreading like silk, staining the sky a dull and hazy white. Zuishin, the man I thought I knew. Zen-san, whom I had only just met. Peering into a past I had never known, I felt as though I had wandered into the heart of some vast and drifting cloud.

"Lady Toki, you are young—a bird only now preparing to leave the nest. Venture too deep into this mountain, and you may lose your way and never return. For now, keep my words only in your heart, and let them rest there."

I looked out at the sky stretching beyond the mountain ridges, past the rock garden, and heard the Abbot's words return to me like an echo from some distant peak. What was I being shown? What was being asked of me?

[The Mountain Path: Below the Stone Steps]

The sun dipped toward the west, and a cool wind wove through the trees, brushing past my neck. As I descended the stone steps, the weight of the vegetables in my arms seemed to pull me back toward the world I actually lived in.

Zen-san's field. The Abbot's story. I felt as though I had been wandering through some fairy tale.

But just as I was about to leave the mountain path, I caught sight of Zuishin sitting at its edge. Usually he let me pass with some light remark. Today he did not move at all. His hand rested on the hilt of his sword, a breath away from drawing it. He carried about him the sharp, piercing air of the hero who had once faced something not of this world.

"...Master Zuishin?"

His eyes held mine, intent. There, before me, stood Ichinosuke—the samurai who had once touched something in his past, and come down from this mountain changed.

"...That face won't do. You've been entirely overwhelmed by the spirit of this place."

His voice was low, and it resonated like a curse.

"I don't care what happened. Or what Zen told you. But you must not go down to the village looking like that. What you're feeling now, my lady—down there, that is nothing but poison."

A needle of pain pierced my chest. Feeling as though I had been seen straight through, some part of me wanted desperately to cover everything up.

"Have you forgotten, my lady? When dawn breaks, you become once more the daughter of the Honjin, charged with receiving the Daimyo's procession. You must fulfill that role. Take a husband. Carry the family forward. That is your fate. ...The man up there has nothing, is bound to nothing, and can live simply by being. We are not so fortunate. We must deceive, play our parts, even crawl through the mud, if we mean to remain within the shape called human."

Zuishin took a step toward me. His eyes carried thirty years of a lie's pain, settled now like sediment at the bottom of a still pool.

"He is honey that must never be touched—a sweet and ruinous poison. Do not lose yourself in this. The longer you indulge this dream, the more the order of the Honjin will warp, and the marriage your parents worked so hard to arrange will turn to ash. Upon whose sacrifice do you imagine this little play of yours is built?"

"That's—I—I..."

"Go home. Put out the fire in your eyes. As the daughter of the Honjin, smile at their flatteries with the eyes of a dead fish. That is what it means to live in this world of men."

Zuishin stepped aside to let me pass, but his back was trembling violently. In denying me, he seemed to be killing, with great effort, some past that might once have been his own—as though, in murdering the lie of Ichinosuke, his own truth might finally be redeemed.

Just then, an alarm bell rang out from the direction of town. The Daimyo's procession was arriving ahead of schedule. The Honjin would already be in an uproar.

I gave Zuishin a deep bow and hurried away. From the corner of my eye I saw him sink down onto the stone steps, his strength gone, staring at the ground.

I am the owl who dwells upon this mountain.
In pushing Toki away, Zuishin's heart had, ironically, loosened more than it had in years. Because he tries so hard to live in truth, his lies have become a poison that eats at him from within. But lies, too, are a kind of human truth.
The village is loud. The mountain stays silent. In these two worlds that were never meant to mingle—what will the young lady see?

                '7': { title: "Chapter 7: The Vitality of the Soil, The Shadow of the Vanguard", videoCode: "kuKv8z3jJ_8", text: `[The Honjin: The Village Inn]

Amid the clanging of the alarm bell and the frantic upheaval through the town, we sat for a brief evening meal deep within the Honjin. Word had come that the vanguard, led by the elder retainer Kuroda-sama, would arrive that night—ahead of the main procession scheduled for the following morning. Around us, the maids' footsteps echoed through the corridors, and the meal laid before us was a humble one—soup and a single dish, simpler than usual.

I found radish and leafy greens in the soup, and at the corner of my tray, carrots dressed in white tofu. A small light seemed to flicker awake within my heart.

(...Zen-san's vegetables.)

I closed my eyes, and the image of him standing in that wild field rose vividly behind them. And yet, in the same breath, Zuishin's sharp words returned to pierce my mind as well.

With my feelings still tangled, I brought the greens to my lips, and stole a brief glance toward my father. He had stopped his chopsticks in silence, chewing slowly, as if confirming something to himself. My mother took a quick sip of soup and spoke.

"With all this chaos, we haven't been able to give the family's meals proper attention."

My father went on eating without a word, then murmured low.

"...Yes. And yet—is it only my imagination, or does this taste more full of life than usual?"

My mother's expression did not change, but she sipped at the soup again, tasting the ingredients for herself.

His words surprised me more than I expected. As I savored that same depth in my own mouth, a quiet certainty settled over me. This was not some fancy of my own making. Everyone at that table could feel it—this quiet strength of life in the food. In that moment, Zuishin's words fell away entirely, and the landscape of Zen-san's field opened wide within my mind.

The warmth of the meal still lingered when it was torn away by a sharp, shouting voice.

"KURODA-SAMA HAS ARRIVED!"

I followed my father and mother to the front gate. Lit by the reddish glare of torches, several samurai appeared—the vanguard sent ahead of the Daimyo. At their center stood an old man whose bearing radiated an overwhelming authority. Kuroda-sama. A retainer whose name had once thundered across the land, known now as the shrewd and ruthless blade of his lord.

Dismounting his horse, Kuroda-sama answered my father's greeting while sweeping his sharp eyes across every corner of the Honjin.

"...It has been some time, Master. I shall be in your care once again. See to it well."

There was something suggestive in his words that made my father bow his head deeply. For some reason I thought, just then, of my conversation with the Abbot on the veranda. There was a past I did not know, here too, tied to this elder retainer.

Kuroda-sama's eyes suddenly turned to me.

"Ho—the girl from that time? You've grown into quite a beauty. Old memories are coming back to me now. But that was ten, twenty years past; I'm an old man now. Let us pass these few days without incident. Wouldn't you agree, Master?"

My father slowly raised his deeply bowed head and led the group inside.

I had no memory of it myself, but it seemed I had met this elder retainer once, long ago, as a child.

"Mother. Why does that man know of me?"

I caught the sleeve of her kimono and asked, once the group had vanished into the inner rooms.

"...It's only natural you don't remember. You were three, perhaps four years old."

My mother kept her eyes fixed on the darkness where Kuroda-sama had gone, and lowered her voice.

"He made his name in war, in his younger and more hot-blooded years. He stayed here once and very nearly caused a violent incident—drew his sword within these very walls. He was warned for it, by those above him. You were only a child at the time, but that day was... Well. As Kuroda-sama says himself, it is the past now."

She said no more. With movements efficient, but somehow strangely mechanical, she left to see to the preparations for his quarters that night.

Once the frantic work of receiving the vanguard had settled, and I finally lay down in my bed, a faint image flickered through my mind: a younger version of myself, wailing in a downpour. It was as hazy as the residue of some half-remembered dream, the memories before and after lost in mist. I tried to draw the thread of it closer, but the day's events washed over me, and I let it go. My body and mind craved nothing but rest.

I had hardly settled before sleep pulled me under, as though I were sliding off the edge of waking. And yet, somewhere in the depths of that irresistible drowsiness, I thought I saw the back of Zen-san—standing still, facing forward, struck again and again by a cold and relentless rain.

                '8': { title: "Chapter 8: The Scent of Iron, The Hunter’s Instinct", videoCode: "EzQZI-dl-nY", text: `I am the owl who dwells upon this mountain.
Even when one means to hide it, the genuine can never be fully concealed. The weight of a blade. The depth of a vegetable's flavor. The fire kindled within a maiden's eyes. An old eagle who once soared over battlefields prefers the raw scent of truth to any dying prey.

[The Honjin: The Guest Room]

A thin veil of cloud draped the sky, blocking the sun and giving an edge to the wind. It was the morning after Kuroda-sama's arrival, and the town was caught in a frenzy of preparation for the full Daimyo procession soon to come.

It happened during the morning meal for Kuroda-sama's party. I had entered the room as a server and stood by in attendance. Kuroda-sama and his men proceeded with their meal without incident—until, quite suddenly, it was not so.

"Master of the Honjin. Come forth."

His voice broke the silence like a roar. Though visibly shaken, my father appeared moments later and prostrated himself before him.

"Master of the Honjin. Did you plan this, knowing I was coming? Every corner of this meal reeks of that field blacksmith. What, pray, is the meaning of it?"

"H-ha... I confess I have no notion of what you mean, my lord."

"Do not play the fool with me. Do you take me for some senile old wreck? Do not underestimate me. I, Kuroda, have not fallen so far that I can no longer tell truth from lies."

His eyes flashed with the sharp glint of a hawk that has sighted its prey.

"It is plain to me what manner of blade carved this venison, these vegetables. And in their taste, the shadow of that man has settled."

Kuroda-sama had once charged through battlefields, and though the long peace had dulled and nearly rusted those old instincts, they had caught, unmistakably, the lingering presence of iron—the old knives in the Honjin's kitchen, the ones Zen-san had forged long ago.

"I withdrew once, for your daughter's sake. But this meal has brought the memory back to me with painful clarity. You are sheltering that man still, are you not?"

"Heaven forbid! Nothing of the sort!"

A cold sweat ran down my back.

(Oh no. Could it be—the vegetables I brought from Zen-san...)

I forced my expression still, and with movements as smooth as a ritual dance, poured plain hot water into a bowl.

"Kuroda-sama. Surely that is only some trick of the mountain spirits. This land has long enjoyed the protection of the sacred peak above us; even our vegetables, I think, carry something of that otherworldly air."

Kuroda-sama's head turned sharply toward me. From the deep furrow between his brows, a chill crept into his gaze, and into mine.

"...Ho. Spirits, you say."

He studied me closely. In my eyes he found, without effort, the foolish lie I was so desperately trying to hide.

"Toki—stay out of this."

He ignored my father's attempt to restrain me, and pressed on in a low, heavy voice.

"Daughter. Do you mean to defy me again, as you did once before? Very well, then. I should like to see the dwelling of these spirits for myself. Once, in this land, I came upon a blade beyond compare. Does the man who forged that iron not still live somewhere on this mountain?"

My heart hammered against my ears. Suppressing the tremor in my hands, I forced a smile.

"Surely you jest. I have heard the man you speak of left for the northern provinces more than twenty years ago. All that remains on the mountain now are a few old monkeys, and a good-for-nothing gatekeeper."

The instant Kuroda-sama heard those words, his eyes lit with a flash of triumph.

(...I have made a mistake.)

The more fiercely I insisted he was not there, the more clearly my desperation to protect him became proof, beyond doubt, that he was.

Without another word, Kuroda-sama drained his bowl and strode from the room. His back was no longer that of a retired old man. It had become, entirely, the back of a hunter closing in on his quarry.` },
                '9': { title: "Chapter 9: The Pinwheel of Lies, The Smile in the Rain", videoCode: "4gSeWEDwU98", text: `I am the owl who dwells upon this mountain.
Words, at times, can pierce a person more sharply than steel. A lie spoken to protect what is dear becomes, in the end, a chain that binds the one who speaks it.
Young lady—trembling there, hidden in the thicket—can you see truth and lie spinning together, like a pinwheel in the wind?

[The Mountain Path: Below the Stone Steps]

The silence of the mountain gate broke beneath the heavy, merciless footsteps of hot-blooded men. Kuroda-sama, with several of his retainers, appeared on the temple's approach.

I could not sit still. I had rushed out ahead of them and hidden myself in the shadow of the bushes. The sun had vanished entirely behind cloud, and a warm, humid wind moved through the trees.

Zuishin stepped out from the side of the path, as he always did. But he had already sensed the men's bloodlust, and his usual careless air was gone. Like a samurai come for a formal duel, he kept his distance from them, one hand resting firm on the hilt of his wakizashi.

"This is no place for outsiders to approach. The depths of this mountain temple are forbidden ground. By whose order have you come?"

His voice, lower than I had ever heard it, carried out through the forest.

"I am Kuroda of Etchū. I have no business with a ronin such as yourself. We are merely passing through. We have no wish to desecrate forbidden ground—we come only to take a little mouse that lives at the foot of this mountain. There is no need to trouble your hands."

Kuroda-sama answered in a tone of calm, though clearly it cost him some effort to hold back his own bloodlust.

"That field blacksmith is part of this mountain as much as anything else here. I will not permit such selfishness. I am the one who slew this mountain's god, and the guardian who keeps watch now over a godless curse. You will not find it so easy to pass."

Kuroda-sama seemed, suddenly, to understand something, and looked at Zuishin with new attention.

"...Ho. I see. Are you not Ichinosuke, the demon-slayer? I remember you now. Hmph—so this is that forbidden land. Whether you cut down a demon or a god, save such fairy tales for village children. What I seek is not the false proof you carried back down this mountain. I seek the man who, even now, strikes iron somewhere in its depths."

Kuroda-sama smiled, defiant, and stepped closer. Zuishin flinched, just barely, before answering.

"Nonsense. I tell you plainly—the man up there is nothing more than a stubborn, eccentric blacksmith."

"Then let me pass. I will see for myself."

Kuroda-sama took another step forward. Zuishin's blade gave a sharp click against its scabbard. For a moment it seemed as though they might come to blows—but then Kuroda-sama leaned close, and whispered something into Zuishin's ear.

At whatever he heard, Zuishin's shoulders trembled, visibly. The majesty of the hero seemed to flake away from him like old paint.

"...Ichinosuke. I must report the truth of the past to our lord. Tell me—is it the mountain you are protecting? Or only your own skin?"

Zuishin's fist opened, powerless. Kuroda-sama pushed past him, and he and his men climbed the stone steps of the mountain gate without looking back.

I watched the entire scene from within the bushes. Standing there, helpless, Zuishin's back looked unbearably small. From the heavy, leaden clouds above, drops of rain began to fall, one by one.

Drops of rain. In my mind, the scent of that same rain rose up from another day, long past. A younger version of myself, clutching the hem of a man's kimono with wet hands. And the face of a younger Zen-san, looking down at me, smiling gently.

(...I remember. That day, I—)

I, too, hurried up the stone steps and turned onto the side path that led to Zen-san's field. Kuroda-sama and his men had already surrounded him. He stood there without even attempting to flee, and they held him down all the same. I hid myself in the thicket, my breath ragged, my trembling hands clasped together as I watched.

They bound him with rope, like some silent tool, and he offered no resistance at all. Only once did he turn his gaze toward the bushes where I hid, and smile, quietly.

His back, as they led him away. The rain growing heavier with every step. The triumphant footsteps of Kuroda-sama and his men, returning toward the Honjin. I pressed my own hands over my mouth, and held back, with everything I had, the scream that had risen in my throat.
` },
                '10': { title: "Chapter 10: The Fragmented Memory, The Prayer of Fire", videoCode: "s_KI4H2szZM", text: `I am the owl who dwells upon this mountain.
By evening, ink-dark clouds had claimed the whole sky, and the rain that had briefly stopped returned as a soft, drifting mist.
The town burned with the feverish energy of the Daimyo's procession, arrived just ahead of the downpour. This rain would likely strand them for at least a day. As if he had foreseen as much, Kuroda-sama had confined Zen to the town's forge and commanded him to strike iron. Surrounded by charcoal, steel, and guards holding bared blades, Zen sat at the center of it all. He had not even reached for his hammer—only stared through the small carved window at the rain, still as a stone that had forgotten how to speak.

[The Town Forge]

I had slipped past my mother's instructions and stood outside the forge beneath my umbrella, watching for any sign of him. A low voice rose suddenly from behind me.

"My lady. It is dangerous to be out at night. Return to the Honjin."

A samurai stood there, wearing a rain hat.

"Master Zuishin... why are you here?"

"Hmph. Reason has nothing to do with it anymore. There are moments when a man's heart moves long before his mind can catch up to it. I have something I must do here. That's all there is to it, I suppose."

The Zuishin I had last seen slumped in despair upon the stone steps was nowhere in this man. In the dim light I saw, deep in his eyes, a gleam sharp as a honed blade. That light lit something in my own heart as well.

When I told him how desperately I wished to speak with Zen-san, he offered to help.

"...Listen well, my lady. There isn't much time. I'll draw the guards off. Leave the rest for later—just tell him plainly what's in your heart."

I nodded deeply at his low command.

Zuishin walked toward the guards and fell into easy, lighthearted talk with them. While their guard dropped before the familiar face of the hero, I slipped past them into the workshop.

The heat of the charcoal pressed against me, thick with the scent of iron and scorched earth. And there, deep within, I saw the same lonely back I had known twenty years before.

"Zen-san..."

"...My lady. You should not be in a place like this."

"I know. I'm sorry. But I had to speak with you."

I sat softly beside him.

"Do you remember? Fifteen years ago, it rained that day too. In the garden of the Honjin, when Kuroda-sama had you cornered."

"...I remember. I could never forget it."

He kept his eyes lowered, and nodded slowly, as if turning the memory over once more.

"That was the day you reminded me of the mountain—of my father and mother there. I could not fit into the town then. I was weary of people, and losing the strength even to strike iron. Then came Kuroda-sama's offer to take me into his service. I told him I would not forge swords. He called it an act of irreverence, and moved to cut me down where I knelt. And that was when you—"

In that instant, every fragment of the memory I had lost came back to me whole.

Zen-san had been the blacksmith my father favored above all others. Seeing his talent, my father had taken him in, though he had no kin of his own. He built him a workshop nearby, and every kitchen knife in the Honjin had been shaped by his hand. Many others in town treasured his work as well; he had become, in his quiet way, indispensable to everyone.

To me, he had always been like an elder brother. He used to smile at me, sing with me, lead me by the hand to the shrine down the road. His presence had been as natural to me, and as comforting, as sunlight on a cradle.

But on that day, in pouring rain, I had found him prostrate before a samurai with his sword half-drawn. Shocked, terrified, suddenly overcome by tears, I had run forward and thrown my small body against his.

"No! You mustn't kill him!"

    // 🔄 画面描写更新
    function updateDisplay() {
        const lang = langData[currentLang];
        
        // 固定UI更新
        document.querySelectorAll('.pwd-req-text').forEach(el => el.textContent = lang.pwdRequired);
        document.querySelectorAll('.password-submit:not(.mystic-submit)').forEach(el => el.textContent = lang.unlockBtn);
        document.querySelectorAll('.password-input').forEach(el => el.setAttribute('placeholder', lang.pwdPlaceholder));
        document.querySelectorAll('.error-message').forEach(el => el.textContent = lang.pwdError);
        document.querySelectorAll('.sub-video-title').forEach(el => el.textContent = lang.videoTitle);
        document.querySelectorAll('.sub-story-title').forEach(el => el.textContent = lang.storyTitle);
        if(document.getElementById('return-btn-text')) {
            document.getElementById('return-btn-text').textContent = lang.backToMain;
        }

        // data-ja / data-en の簡易切替
        document.querySelectorAll('[data-ja]').forEach(el => {
            const text = el.getAttribute('data-' + currentLang);
            if(text) el.textContent = text;
        });

        // タイトル設定
        if (currentChapter === 'mystic') {
            const mysticData = lang.mystic;
            if(document.getElementById('title-mystic')) document.getElementById('title-mystic').textContent = mysticData.title;
        } else {
            const chData = lang.chapters[currentChapter];
            if (chData) {
                const tEl = document.getElementById(`title-${currentChapter}`);
                const txtEl = document.getElementById(`text-${currentChapter}`);
                const vEl = document.getElementById(`video-${currentChapter}`);
                if (tEl) tEl.textContent = chData.title;
                if (txtEl) txtEl.textContent = chData.text;
                if (vEl && chData.videoCode) vEl.src = "https://www.youtube.com/embed/" + chData.videoCode;
            }
        }
    }

    // 🔄 タブ切替
    function switchTab(chapterNum) {
        currentChapter = chapterNum;

        document.querySelectorAll('.content-section').forEach(sec => {
            sec.style.display = 'none';
            sec.classList.remove('active');
        });
        if (document.getElementById('section-mystic')) document.getElementById('section-mystic').style.display = 'none';
        if (document.getElementById('main-nav')) document.getElementById('main-nav').style.display = 'flex';

        const target = document.getElementById('section-' + chapterNum);
        if(target) {
            target.style.display = 'block';
            target.classList.add('active');
        }

        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        const activeBtn = Array.from(document.querySelectorAll('.tab-btn')).find(btn => {
            const attr = btn.getAttribute('onclick');
            return attr && attr.includes(`'${chapterNum}'`);
        });
        if(activeBtn) activeBtn.classList.add('active');

        // パスワード不要（1話など）の場合は最初から中身を開く
        if(configData.passwords[chapterNum] === '') {
            const auth = document.getElementById('auth-' + chapterNum);
            const content = document.getElementById('content-' + chapterNum);
            if(auth) auth.style.display = 'none';
            if(content) content.style.display = 'block';
        }

        updateDisplay();
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // 🔐 パスワード判定
    function checkPassword(chapterNum) {
        const section = document.getElementById('section-' + chapterNum);
        if (!section) return;

        const inputEl = section.querySelector('.password-input');
        const input = inputEl ? inputEl.value : '';
        const errorMsg = document.getElementById('error-' + chapterNum);
        const authOverlay = document.getElementById('auth-' + chapterNum);
        const protectedContent = document.getElementById('content-' + chapterNum);

        if (input === configData.passwords[chapterNum]) {
            if (authOverlay) authOverlay.style.display = 'none';
            if (protectedContent) protectedContent.style.display = 'block';
            if (errorMsg) errorMsg.style.display = 'none';
        } else {
            if (errorMsg) errorMsg.style.display = 'block';
        }
    }

        window.scrollTo({ top: 0, behavior: 'smooth' });

        document.querySelectorAll('.password-input').forEach(input => {
            input.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    const section = this.closest('.content-section');
                    if (section) {
                        const num = section.id.replace('section-', '');
                        checkPassword(num);
                    }
                }
            });

        const mysticInput = document.getElementById('input-mystic');
        if(mysticInput) {
