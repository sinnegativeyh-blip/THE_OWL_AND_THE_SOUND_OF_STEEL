    <style>
        :root {
            --bg-color: #0b0f19;
            --text-color: #cbd5e1;
            --accent-color: #ff5722;
            --accent-glow: rgba(255, 87, 34, 0.4);
            --card-bg: #1a202c;
            --border-color: #2d3748;
            --mystic-color: #8b5cf6;
            --mystic-glow: rgba(139, 92, 246, 0.4);

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans JP", sans-serif;

            margin: 0;
            padding: 0;
            -webkit-font-smoothing: antialiased;
        }

        header {
            text-align: center;
            padding: 60px 20px;
            background: linear-gradient(to bottom, #111827, var(--bg-color));
            border-bottom: 1px solid var(--border-color);
        }

        .header-logo {
            max-width: 150px;
            margin-bottom: 20px;
            filter: drop-shadow(0 0 10px rgba(255,255,255,0.1));
        }

        h1 {
            font-size: 2.2rem;
            color: #ffffff;
            margin: 0 0 10px 0;
            letter-spacing: 0.05em;
            font-weight: 700;
        }

        .subtitle {
            font-size: 1.1rem;
            color: #9ca3af;
            margin: 0;
        }

        .lang-switch {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 30px;
        }

        .lang-btn {
            background-color: #111827;
            color: #9ca3af;
            border: 1px solid var(--border-color);
            padding: 8px 20px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9rem;
            transition: all 0.3s ease;
        }

        .lang-btn:hover {
            border-color: var(--accent-color);
            color: #ffffff;
        }

        main {
            max-width: 800px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        .nav-container {
            display: flex;
            justify-content: center;
            margin-bottom: 40px;
        }

        .tab-nav {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
            background-color: #111827;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            max-width: 100%;
        }

        .tab-btn {
            background: none;
            border: none;
            color: #9ca3af;
            padding: 10px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.95rem;
            font-weight: 600;
            transition: all 0.2s ease;
            white-space: nowrap;
        }

        .tab-btn:hover {
            color: #ffffff;
            background-color: rgba(255, 255, 255, 0.05);
        }

        .tab-btn.active {
            background-color: var(--accent-color);
            color: #ffffff;
            box-shadow: 0 0 12px var(--accent-glow);
        }

        .content-section {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 40px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        .story-title {
            font-size: 1.8rem;
            color: #ffffff;
            margin-top: 0;
            margin-bottom: 30px;
            padding-bottom: 15px;
            border-bottom: 2px solid var(--border-color);
            letter-spacing: 0.02em;
        }

        .password-overlay {
            background-color: #111827;
            border: 1px dashed var(--border-color);
            border-radius: 8px;
            padding: 40px 20px;
            text-align: center;
            margin: 20px 0;
        }

        .password-overlay h3 {
            color: #ffffff;
            margin-top: 0;
            margin-bottom: 20px;
            font-size: 1.2rem;
        }

        .password-form {
            display: flex;
            justify-content: center;
            gap: 10px;
            max-width: 400px;
            margin: 0 auto;
        }

        .password-input {
            flex: 1;
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            color: #ffffff;
            padding: 12px 16px;
            border-radius: 6px;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.3s;
        }

        .password-input:focus {
            border-color: var(--accent-color);
        }

        .password-submit {
            background-color: var(--accent-color);
            color: #ffffff;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
            box-shadow: 0 0 8px var(--accent-glow);
        }

        .password-submit:hover {
            opacity: 0.9;
        }

        .error-message {
            color: #ef4444;
            margin-top: 15px;
            font-size: 0.95rem;
            font-weight: 600;
            display: none;
        }

        .protected-content {
            display: none;
        }

        .sub-section-title {
            font-size: 1.3rem;
            color: #ffffff;
            margin-top: 40px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .sub-section-title::before {
            content: "";
            display: inline-block;
            width: 4px;
            height: 18px;
            background-color: var(--accent-color);
            border-radius: 2px;
        }

        .video-container {
            position: relative;
            padding-bottom: 56.25%;
            height: 0;
            overflow: hidden;
            max-width: 100%;
            background-color: #000;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }

        .story-text {
            font-size: 1.1rem;
            color: var(--text-color);
            white-space: pre-wrap;
            word-wrap: break-word;
            background-color: #111827;
            padding: 30px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        /* 山の上のすみか専用装飾 */
        .mystic-title {
            color: #c084fc !important;
            border-bottom-color: var(--mystic-color) !important;
        }
        .mystic-border::before {
            background-color: var(--mystic-color) !important;
        }
        .mystic-submit {
            background-color: var(--mystic-color) !important;
            box-shadow: 0 0 8px rgba(139, 92, 246, 0.4) !important;
        }
        #input-mystic:focus {

        }

            text-align: center;
            padding: 40px 20px;
            color: #64748b;
            font-size: 0.9rem;
            border-top: 1px solid var(--border-color);
            margin-top: 60px;

                '8': { title: "第八話：錆びた闘心、剥き出しの牙", videoCode: "EzQZI-dl-nY", text: `　私は、この山に住まうふくろう。

〈本陣　座敷〉

                '10': { title: "第十話：雨の匂い、蘇る記憶の音", videoCode: "s_KI4H2szZM", text: `〈宿場町の鍛冶場〉

                '11': { title: "第十一話：自（おの）ずから然（しか）らむる法", videoCode: "uiUJW4voZ8M", text: `〈宿場町の鍛冶場〉

                    text: `Imagine a sound you have never heard before.
A sound more soothing than any other, one that makes the soul tremble. A sound that makes you want to let go of everything you’ve known and simply surrender. That sound—the one I heard—changed everything.

...Hoo... Hoo...
I am the owl who dwells upon this mountain. 
I awaken as the veil of night descends, watching the ever-shifting flow of human life with a steady, silent gaze. 
Our story begins when the air is still heavy with the morning mist. It begins with the sound of striking iron—a sound that wakes the mountain’s silence, blunt as always, yet strangely tender...
Clang... Clang...
You can hear it too, can't you? That sound.

[The Honjin: An Inn for Great Lords]
At that moment, I could not even feel the coldness of the earth pressing through the soles of my tabi socks.
The conversation from the night before—my father’s talk of an arranged marriage—still lingered in my ears like a stagnant pool.
"It is for your own happiness," he had said. Those words felt like the final push, the last bit of clay to mold me into my role: the daughter of the Honjin.

"I am going to the temple in your stead. Please, see to the rest."
Leaving behind a single note, I slipped out the back door just before the sixth hour of morning (6:00 AM), as the first roosters began to crow. 
I headed toward the mountain temple, a place I visited once or twice a month for prayers on behalf of the family. To a woman of my age, these "proxy pilgrimages" were supposed to be a public debut—a ceremony where I would wear beautiful kimonos, walk with grace, and fulfill the expectations of others. But this morning was different. I simply wanted to take myself... somewhere else.
To the east, the mountain emitted a halo of light, shielding the sun that was just about to show its face. In the western sky, a deep lapis lazuli remained. The boundary where night and day merged felt like the threshold between this world and the next. Leaving the highway for a side path, I passed through the graveyard, and the slope transformed into a mountain trail. 
After a short climb, I reached the straight stone stairway that leads to the temple.
The mountain was thick with mist, chilling in the morning air. And then, from within that mist at the foot of the stairs, a familiar figure loomed. 
Zuishin—the man the villagers called Ichinosuke.
"My, my... what manner of footsteps would dare disturb the mountain's silence so early? If it isn't the young lady of the Honjin."
His voice was teasing, as usual. Once hailed as a hero who slew a demon, he was now known only as the eccentric gatekeeper who haunted the mountain's edge. Only the head priest called him Zuishin. It had become my custom to exchange a few words with him here during my monthly visits.
"Master Zuishin, please move. This morning... I do not wish to see anyone's face."
Zuishin watched over every soul that ascended this mountain, ensuring no one ventured too far into the peaks. I did not know why, but I had heard rumors of some ancient grievance. He stood before me now like the heavy doors of a temple gate. He didn't budge. Instead, he peered into my face and let out a faint, powerless laugh. For a fleeting second, I felt the light in his eyes shift.
"My lady... this is not good. If you climb the mountain in that state, you will surely call forth the malevolent spirits... Still, very well. Just be careful. The mountain’s poison is strong."
He slipped away into the shadows by the path. Shaking off his words, I hurried up the stone steps.

The stairs were deserted. Cedar trees blocked out the sky, where darkness and light intertwined. It was then.

—CLANG.

A sharp, crystalline sound pierced the air. It wasn't the temple bell, nor a human call. It was like a strike upon a gong, a sound that vibrated deep within my chest.

—CLANG. CLANG. CLANG.

The heavy mist that had clouded my heart seemed to vanish in an instant. My soul was immediately possessed by that sound. The agitation that had been swirling within me went silent; my hurried feet lost their strength and came to a halt. As if pulled by an invisible thread, I veered off the path and was drawn toward the source.
Parting the tall grass and bypassing the old stairs, I found a small building tucked away in the shadows. Through the open door, I saw Fire. Something was clashing against the sound, sending sparks flying—vivid vermillion flashes dancing against the cold blue of the dawn.
There, with his upper body bare, was the back of a man swinging a hammer with singular focus. 
Zen, the field blacksmith. They said he used to work in the town before retreating to live alone in the mountains. No one knew his true story. 
During my usual visits, I had only ever seen him as a man of few words, carrying soiled vegetables or bundles of firewood. I had never given him a second thought.But the man standing there was someone else entirely. 
With every strike, the iron sang in red, and the muscles of his arms rippled like waves. 
In his profile, there was a solitary dignity—someone who flattered no one and feared nothing. I forgot to breathe. Watching the muscles of his arms lash out at the boundary of fire and shadow, I felt the rhythmic pulses of sound deep in my ears. 
Without turning around, the man delivered one final strike.

—THUD.

It echoed with a heavy resonance. In that moment, my body froze, as if turned to stone.`

                '2': { title: "Chapter 2: The Fruitless Bloom, The Spark of Awakening", videoCode: "iwjrjTcw2W4", text: `I am the owl who dwells upon this mountain. 
The moon sinks, and the sky begins to pale. This is the inside of the boundary—the sacred threshold that must not be crossed.

My heart hammered in my ears, loud and intrusive. I remained motionless. I could not apologize, nor could I flee. I felt a shame as if my bare self were being exposed to the world, yet at the same time, struck by this intense, unseen light, I felt as if I were in a state of trance.

It should have been frightening, yet deep within my chest, a small flame of curiosity—unlike any I had ever known—burst into life.

                '3': { title: "Chapter 3: The Faded Backdrop, The Only Truth", videoCode: "SHWoC3oBuV0", text: `I am the owl who dwells upon this mountain. 
Human beings are such that, once they hear a single "sound" that makes the soul tremble, the garden they loved until yesterday suddenly looks like nothing more than the painted cardboard scenery of a playhouse. 
Young lady... how does the town look to your eyes now? Do the vibrant kimonos and the sweet confections all seem translucent and grey?

[The Honjin: The Village Inn]
Since that day, I could do nothing but count the days on the calendar.

                '4': { title: "Chapter 4: The Sea of Grass, The Breath of the Earth", videoCode: "E5PL_G4mz5g", text: `The sunlight filtering through the canopy descended upon the meadow like shimmering particles of light. The kaleidoscope of flowers and the vibrant green of the healthy grasses gently unraveled the knots in my heart. The echoing chirps of birds were kind to my ears; the scent of life—from the soil, the grass, the flowers, and the insects—brought me a profound sense of peace.

Zen-san’s voice. Hearing it for the first time, I felt a strange nostalgia, a resonance that echoed into the deepest parts of my memory with a gentle lingering. My focus returned to the vegetables held out to me, and for a fleeting second, I hesitated. But looking into his clear, guileless eyes—eyes free of any ulterior motive—I reached out and accepted the gift.

For a moment, I was startled by the sound of my own voice. I realized that my very breathing had changed. It was no longer the thin, shallow breath I had repeated in the depths of the Honjin, confined to my chest. It was a smooth, rhythmic flow—as if I were drawing the coldness and the warmth of the earth up through the soles of my feet, awakening every cell in my body.
While I stood there in awe, Zen-san walked away again, his hand once more brushing the path through the wild green.
To me, this boundless landscape and the figure of Zen-san felt like a fairy tale my mother used to whisper by my bedside, or a daydream I once imagined while staring at the clouds by the riverbank. 
Even the sound of the wind through the trees, which sometimes felt frightening, sounded here like a grand, welcoming orchestra. The bees flitting from flower to flower, the butterflies dancing in the air, and the ladybugs crawling through the grass below—everything felt brimming with joy. 
For a long while, I stood entranced in Zen-san’s field, that beautiful "Peach Blossom Spring," completely losing track of time.
At that moment, I had no way of knowing that Zuisin was watching from the shadows of the trees behind me. Nor did I know the reason why a young samurai named Ichinosuke became the man known as Zuisin—or that the blacksmith named Zen was already hidden deep within the echoes of my own memory.

                '5': { title: "Chapter 5: The Abbot’s Beads, The God of the Mountain", videoCode: "Y1oXgLNnV3I", text: `I am the owl who dwells upon this mountain. 
A temple is a place that draws both the virtuous and the wicked in equal measure. It is the Abbot’s duty to smooth over such chaos. 
Today, those worn prayer beads of his will surely prove their worth.

[Front of the Buddhist Hall: The Mountain Temple]
"It is a fine day, is it not, Lady Toki?"
The Abbot’s voice brought me back to my senses. I had climbed the stone steps in a daze. I quietly placed the furoshiki bundle of Zen-san’s vegetables at the corner of the stairs and passed through the mountain gate, where the Abbot stood waiting. 
During my monthly pilgrimages, he always offered me gracious sermons and listened kindly to the news of my daily life. To me, he was the most comforting presence I knew.
"Good day to you, Abbot."
"Ho, Lady Toki. Has something pleasant happened? Your voice is as vibrant as a bird’s, and your breath flows with unusual clarity."
I felt my cheeks flush. Embarrassed by his keen observation, I reflexively lowered my gaze.
"Ha ha ha, very well. It must be proof that your upcoming marriage is a blessed match. The Honjin remains secure—that is a relief to all."
"...Abbot, no. It is not about the marriage."
"Oh? Then what might it be?"
"Abbot... you know Zen-san, the field blacksmith, do you not? I have just come from his field."
The Abbot’s gentle smile flickered and stopped. His eyes took on a quiet light, as if peering into a deep abyss.
"I see. So you went to Zen’s place. ...Lady Toki, the water of the mountain is deeper than that of the village. At times, it is too strong for those from the lowlands."
His words gave me a powerful sense of déjà vu. It was exactly what Zuishin had said: "The mountain’s poison is strong."
"You say the same things as Master Zuishin, Abbot."
"Indeed, Zuishin. He is one who was overwhelmed by that very mountain water. For thirty years, he has been eroding away within it. Lady Toki, perhaps... you have been called by those two."
Before I could ask what he meant, the Abbot silently beckoned me inside.

At the end of the stone path extending from the gate stood the solemn Buddhist Hall. 
The Abbot placed his geta sandals at the edge of the stairs, and I followed suit, lining up my setta sandals. We climbed the stairs to the main entrance. 
Under the long, protruding eaves, the warm sunlight was blocked, and a cool breeze brushed against my neck. Inside the dim hall, the Abbot bowed to the Shakamuni Buddha enshrined in the center of the wooden floor. He then led me out through a right-side doorway to a corner of the veranda overlooking the rock garden and the mountain behind. The scent of incense lingered, and the wooden boards felt cool beneath me. The Abbot began to speak while gazing at the distant mountain range.
"Zen appeared in the town out of nowhere, shortly before you were born. At first, he could not speak our language and possessed no human customs. Yet, in an instant, he learned the ways of people, gained their trust, and melted into the town. ...But after some years passed, those who envied him appeared. There were those who deceived him, and eventually, those who tried to exploit him. In the end, he left the town of his own accord and retreated into the foothills of this mountain. Many lamented his departure... Zen chose the water of the mountain over the water of the town."
I stared at the sand patterns of the rock garden, pondering his strange destiny.
"And then there is Zuishin—Ichinosuke. He and I have been companions since they were boys. Ichinosuke was always timid, a coward who wouldn't kill a bug. That he became peerless once he held a sword... Heaven’s design can be such an irony."
"...Then, the stories of the demon slaying?"
"Yes, that happened when both Zuishin and I were young. Disasters haunted the town, and rumors spread that it was the work of a demon. A decision was made to send a skilled warrior to slay it, and Ichinosuke was the one chosen. Too timid to refuse, he was pushed into it by the very people who knew of his weakness. To save the town, he went up the mountain prepared to die. And yet, what do you think? Not five days had passed before he returned with a 'necklace' as proof of the demon’s demise. Since then, the disasters ceased, and he became a hero... but I could never quite believe it."
The Abbot paused there and let out a deep sigh.
"One night, Ichinosuke came to me, trembling, and confessed. There was no demon. There was only the Mountain God. This necklace was not something he took; it was a 'curse' he had been granted."

                '6': { title: "Chapter 6: The Marrow of Truth, The Cage of Roles", videoCode: "nYY1XH4gOQQ", text: `[The Veranda of the Buddhist Hall]
"I gave him the name 'Zuishin' as his Buddhist name. It means 'The Marrow of the Soul,' or 'The Core of Truth.' Lies in the mundane world—the Shaba—are simply human nature. I told him that once he entered the priesthood, such things would be unnecessary. I told him to cast them aside. I said, 'Ichinosuke is dead; from now on, live your Truth.' In the end, he settled by the side of those stone steps. He turned the mountain into forbidden ground, ensuring no soul ventured into its depths, as if he were feeding upon his own curse. And yet, I cannot believe that this... is his true 'Marrow'..."

"Zuishin claimed there was no demon—that the slaying was a lie. Yet he surely held that necklace in his hand. It was not a trinket that could be fashioned in a mere five days. Zuishin met someone, and he was granted that gift. No matter who it was he met, Zuishin fears the exposure of his lie from the bottom of his soul. That is why he clings to those stone steps. I do not understand why he fears it so much, but for him now, that lie is everything."

But as I was about to leave the mountain path, the figure of Zuishin sitting by the side caught my eye. Usually, he would let me pass with a lighthearted remark. Today, he did not move a muscle. His hand rested on the hilt of his sword, just a breath away from drawing it. He exuded the sharp, piercing aura of the "Hero" who once faced an aberration.

Zuishin took a step toward me. His eyes were stained with thirty years of "the pain of lies" that had settled like dregs.
"He is like a honey that must not be touched—a sweet, delusional poison. ...Do not lose yourself. The more you indulge in this dream, the more the laws of the Honjin will warp, and the marriage arrangement your parents worked so hard to build will turn to ash. ...Upon whose sacrifice do you think your little 'play' is built?"

Zuishin stepped aside to clear the path, but his back was trembling violently. By denying me, he seemed to be desperately killing his own "past that might have been." It was as if by slaying the lie of Ichinosuke, Zuishin’s Truth might finally find its reward.
Just then, the sound of a signal bell rang out from the direction of the town, announcing an emergency. The Daimyo’s procession—the Sankin-kotai—was arriving earlier than scheduled. The Honjin would be in an uproar. 
I gave Zuishin a deep bow and hurried away. From the corner of my eye, I saw him sink powerlessly onto the stone steps, staring at the ground...

I am the owl who dwells upon this mountain. 
By pushing Toki away, Zuishin’s heart had, ironically, "loosened" more than ever before. Because he tries to live in Truth, his lies become a poison that erodes him. Lies, too, are a human Truth. 
The village is loud; the mountain remains silent. In these two worlds that were never meant to mingle, what will the young lady see?

                '7': { title: "Chapter 7: The Vitality of the Soil, The Shadow of the Vanguard", videoCode: "kuKv8z3jJ_8", text: `[The Honjin: The Village Inn]
Amidst the clanging of the emergency bell and the frantic upheaval within the town, we were seated for a fleeting evening meal deep within the Honjin. Word had arrived that the vanguard, led by the elder retainer Kuroda-sama, would arrive tonight—ahead of the main Daimyo procession scheduled for tomorrow morning. While the sounds of maids racing through the corridors echoed around us, the meal laid out was a humble Ichiju-Issai (one soup, one side), simpler than usual.
I found radish and leafy greens in the soup, and in the corner of my tray, carrots dressed in white tofu. A small light seemed to flicker to life within my heart. 
(...Zen-san’s vegetables.) 
Closing my eyes, the image of Zen-san standing in that wild field rose vividly behind my eyelids. Yet, at the same time, Zuishin’s sharp words pierced my mind. 
With a tangle of emotions, I brought the greens to my lips and cast a brief, cautious glance toward my father. He had stopped his chopsticks in silence. He was chewing slowly, as if confirming something. My mother quickly took a sip of the soup and spoke. 
"With all this chaos, we haven't been able to pay proper attention to the family's meals." 
My father resumed eating without a word, then murmured in a low voice:
"...Yes. And yet, is it my imagination, or does this taste more nourishing—more full of life—than usual?"
Though my mother’s expression did not change, she sipped the soup again, carefully tasting the ingredients for herself.
I felt a surge of surprise at my father’s words. As I savored that same "nourishing depth" in my own mouth, I felt a sense of certainty. This was not some delusion of my own making. Everyone could truly feel it—this power of life. In that moment, Zuishin’s words vanished, and the landscape of Zen-san’s field spread wide within my mind.

As the warmth of the meal lingered, it was suddenly torn away by a sharp, shouting voice.
"KURODA-SAMA HAS ARRIVED!"

Dismounting his horse, Kuroda-sama responded to my father’s greeting while sweeping his piercing gaze across every corner of the Honjin.
 "...It has been some time, Master. I shall be in your care once again. See to it well."

Kuroda-sama suddenly turned his eyes toward me. 
"Ho... the girl from that time? You have grown quite beautiful. Many memories are resurfacing. But that was ten, twenty years ago; I am old now. Let us spend these few days without incident. Wouldn't you agree, Master?"

Once the frantic reception of the vanguard had settled, and I finally lay down in my late-night bed, a faint image flickered in my mind: a young version of myself, wailing in a torrential downpour. It was as hazy as the residue of a dream, the memories before and after shrouded in mist. I tried to pull the thread of the memory closer, but I was washed away by the overwhelming events of the day. My body and mind craved deep rest.
Shortly after falling into bed, I was pulled into sleep as if sliding off the edge of consciousness. Yet, in the depths of that irresistible slumber, I felt as though I was staring at the back of Zen-san—standing still, gazing forward, while being struck by a cold, relentless rain.

                '8': { title: "Chapter 8: The Scent of Iron, The Hunter’s Instinct", videoCode: "EzQZI-dl-nY", text: `I am the owl who dwells upon this mountain. 
Even if one intends to hide it, the genuine can never be fully concealed. The weight of a blade, the depth of a vegetable’s flavor, and the fire ignited within a maiden's eyes. An old eagle who once soared over battlefields prefers the raw scent of "Truth" over any dying prey.

[The Honjin: The Guest Room]
A thin veil of clouds draped the sky, blocking the sun and making the wind feel a touch colder. 
It was the morning after Kuroda-sama’s arrival, and the town was in a frenzy of preparation to receive the full Daimyo procession.
It was during the morning meal for Kuroda-sama’s party. I had entered the room as a server and stood by in attendance. Kuroda-sama and his subordinates were proceeding with their meal without incident—until it happened quite suddenly.

Kuroda-sama’s eyes flashed with the sharp glint of a raptor stalking its prey.
"It is plain as day to me what manner of blade was used to carve this venison and these vegetables. And in their taste, the shadow of that man has taken possession."

"At that time, I withdrew for the sake of your daughter, but this meal has brought my memories back with vivid clarity. You... you are still sheltering that man, aren't you?"

 (Oh no... could it be? Because of the vegetables I brought from Zen-san...) 
I struggled to maintain a mask of composure and, with movements as fluid as a ritual dance, I poured plain hot water into a bowl.
"Kuroda-sama. Surely that is but a trick of the mountain spirits. Since ancient times, this land has enjoyed the protection of the sacred peak; thus, even the local vegetables possess a flavor that feels somewhat otherworldly."
Kuroda-sama turned his head sharply toward me. From the depths of the deep furrows between his brows, a chilling gaze crept into mine.

The moment Kuroda-sama heard my words, his eyes lit up with a momentary flash of triumph. 
(...I’ve made a mistake.)
The more I declared "He is not here," the more my "desperate need to protect" became the irrefutable evidence that Zen-san was, indeed, there.
Without another word, Kuroda-sama drained his bowl of hot water and strode out of the room. His back was no longer that of a retired old man; it had completely transformed into that of a samurai closing in on his quarry.

                '9': { title: "Chapter 9: The Pinwheel of Lies, The Smile in the Rain", videoCode: "4gSeWEDwU98", text: `I am the owl who dwells upon this mountain. 
Words, at times, can pierce a person more sharply than steel. A lie uttered to protect what is dear becomes a chain that binds the speaker.

Zen-san’s back as he was led away. The rain was gradually growing stronger. The triumphant footsteps of Kuroda-sama and his men as they returned toward the Honjin. I desperately stifled the scream that had risen to my throat with my own hands.

                '10': { title: "Chapter 10: The Fragmented Memory, The Prayer of Fire", videoCode: "s_KI4H2szZM", text: `I am the owl who dwells upon this mountain. 
By evening, ink-dark clouds had completely claimed the sky, and the rain that had briefly ceased returned as a silent, misty drizzle. 
The town was flushed with the feverish energy of the Daimyo’s procession, which had arrived just before the downpour. This rain would likely strand them for at least a day. As if anticipating this, Kuroda-sama had confined Zen to the town’s forge, commanding him to strike iron. Amidst charcoal, steel, and guards holding unsheathed blades, Zen sat at the center. He did not even reach for his hammer; instead, he stared through the small, carved window at the rainy sky, as still as a stone that had forgotten the use of words.

[The Town Forge]
I had shaken off my mother’s instructions and stood outside the forge under my umbrella, watching for any sign of Zen-san. Suddenly, a low voice resonated from behind me.
"My lady, it is dangerous to be out at night. Return to the Honjin."
There stood a samurai clad in a rain hat. 
"Master Zuishin... why are you here?"
"Hmph. Reason has nothing to do with it anymore. There are times for a human when the heart moves long before the mind can think. ...I have something I must do here. I suppose that is all there is to it."
The Zuishin who had been slumped in despair on the stone steps was gone. In the dim light, I saw the depths of his eyes shining as sharp as a honed blade. That light ignited a fire of resolve within my own heart.
When I told him I desperately wanted to speak with Zen-san, Zuishin offered his help.
"...Listen well, my lady. Time is short. I will draw the guards' attention. Leave the details for later and tell him what is truly in your heart."
I nodded deeply at Zuishin’s low command.
Zuishin approached the guards and began to trade lighthearted banter. Taking advantage of the moment when the guards lowered their guard before the familiar face of the "Hero," I slipped into the workshop. 

The sweltering heat of the charcoal fire pressed against me, along with the scent of iron and scorched earth. Deep within, I saw that same lonely back I had known twenty years ago.
"Zen-san..."
"...My lady. You should not be in a place like this."
"I’m sorry, I know. But I had to speak to you." 
I sat softly beside him. 
"Do you remember? ...Fifteen years ago, it was raining that day, too. In the garden of the Honjin, when you were being cornered by Kuroda-sama."
"...I remember. I could never forget."
Zen-san kept his gaze lowered, nodding slowly as if savoring the memory. 
"That was... when you reminded me of the mountain, and of my father and mother. Back then, I could not fit into the town. I was weary of people, and I was losing my strength to strike iron. Then came the offer from Kuroda-sama to take me into his service. But I told him I would not forge swords... He called it an act of irreverence and moved to strike me down... and that was when you..."
At that moment, I reclaimed every fragment of the memory I had lost.

Zen-san was the blacksmith my father had favored. Seeing his talent, my father had brought Zen-san in, even though he had no kin. He set up a workshop nearby, and every kitchen knife in the Honjin was crafted by Zen-san’s hand. Of course, many others in town cherished his work; he was indispensable to everyone. 
To me, Zen-san had always been like an elder brother by my side. He would smile at me, sing songs with me, and lead me by the hand to the nearby shrine. To me, his presence was as natural and comforting as a sunny cradle.
But on that day, amidst a torrential rain, Zen-san had been prostrating himself before a samurai who was about to draw his sword. In my shock and terror, overcome by a sudden surge of tears, I had dashed forward and clung to Zen-san with my small body. 
"No! You mustn't kill him!" 
Drenched in rain and tears, I had screamed over and over.
Ah... how could I have locked away such an important memory in the depths of my mind? Large tears spilled from my eyes. 
I took Zen-san’s gnarled, calloused hand in both of mine. For a moment, his fingers moved in bewilderment, but eventually, he quietly squeezed my hand back. He continued:
"...I was abandoned on the mountain when I was an infant. I have a father and mother who took me in and raised me, but they are not human. I grew up without knowing human sentiment. When I reached the age of independence, I wanted to know about my birth parents and the village. That is why I came to this town. At first, I didn't understand the language and couldn't do anything expected of a person. It was your father who took me in. He taught me to read and write, the customs of the village—everything. He gave me a workshop and raised me to be a man among men. It was shortly after I arrived in town that you were born."
I listened quietly, wiping away my tears. Zen-san’s voice, warmed by the fire of the furnace, resonated slowly. 
"My lady, you were the first to grant me the feeling of affection—of tenderness. The strong desire to cherish someone. Watching you grow and seeing the way you smiled at me reminded me of the feelings my mountain father and mother must have had for me. The feelings my birth parents must have also held, despite whatever unfathomable circumstances they faced. Because of you, I came to know what it is to have a human heart. ...I do not want to make you sad. ...Even if it means I must lose these arms."
In that instant, I felt a powerful resolve within Zen-san, and the words tumbled out of me. 
"Let’s run away, Zen-san. Mater Zuishin is waiting outside."

    // 🔄 画面描写更新
    function updateDisplay() {
        const lang = langData[currentLang];
        
        // 固定UI更新
        document.querySelectorAll('.pwd-req-text').forEach(el => el.textContent = lang.pwdRequired);
        document.querySelectorAll('.password-submit:not(.mystic-submit)').forEach(el => el.textContent = lang.unlockBtn);
        document.querySelectorAll('.password-input').forEach(el => el.setAttribute('placeholder', lang.pwdPlaceholder));
        document.querySelectorAll('.error-message').forEach(el => el.textContent = lang.pwdError);
        document.querySelectorAll('.sub-video-title').forEach(el => el.textContent = lang.videoTitle);
        document.querySelectorAll('.sub-story-title').forEach(el => el.textContent = lang.storyTitle);
        if(document.getElementById('return-btn-text')) {
            document.getElementById('return-btn-text').textContent = lang.backToMain;
        }

        // data-ja / data-en の簡易切替
        document.querySelectorAll('[data-ja]').forEach(el => {
            const text = el.getAttribute('data-' + currentLang);
            if(text) el.textContent = text;
        });

        // タイトル設定
        if (currentChapter === 'mystic') {
            const mysticData = lang.mystic;
            if(document.getElementById('title-mystic')) document.getElementById('title-mystic').textContent = mysticData.title;
        } else {
            const chData = lang.chapters[currentChapter];
            if (chData) {
                const tEl = document.getElementById(`title-${currentChapter}`);
                const txtEl = document.getElementById(`text-${currentChapter}`);
                const vEl = document.getElementById(`video-${currentChapter}`);
                if (tEl) tEl.textContent = chData.title;
                if (txtEl) txtEl.textContent = chData.text;
                if (vEl && chData.videoCode) vEl.src = "https://www.youtube.com/embed/" + chData.videoCode;
            }
        }
    }

    // 🔄 タブ切替
    function switchTab(chapterNum) {
        currentChapter = chapterNum;

        document.querySelectorAll('.content-section').forEach(sec => {
            sec.style.display = 'none';
            sec.classList.remove('active');
        });
        if (document.getElementById('section-mystic')) document.getElementById('section-mystic').style.display = 'none';
        if (document.getElementById('main-nav')) document.getElementById('main-nav').style.display = 'flex';

        const target = document.getElementById('section-' + chapterNum);
        if(target) {
            target.style.display = 'block';
            target.classList.add('active');
        }

        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        const activeBtn = Array.from(document.querySelectorAll('.tab-btn')).find(btn => {
            const attr = btn.getAttribute('onclick');
            return attr && attr.includes(`'${chapterNum}'`);
        });
        if(activeBtn) activeBtn.classList.add('active');

        // パスワード不要（1話など）の場合は最初から中身を開く
        if(configData.passwords[chapterNum] === '') {
            const auth = document.getElementById('auth-' + chapterNum);
            const content = document.getElementById('content-' + chapterNum);
            if(auth) auth.style.display = 'none';
            if(content) content.style.display = 'block';
        }

        updateDisplay();
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // 🔐 パスワード判定
    function checkPassword(chapterNum) {
        const section = document.getElementById('section-' + chapterNum);
        if (!section) return;

        const inputEl = section.querySelector('.password-input');
        const input = inputEl ? inputEl.value : '';
        const errorMsg = document.getElementById('error-' + chapterNum);
        const authOverlay = document.getElementById('auth-' + chapterNum);
        const protectedContent = document.getElementById('content-' + chapterNum);

        if (input === configData.passwords[chapterNum]) {
            if (authOverlay) authOverlay.style.display = 'none';
            if (protectedContent) protectedContent.style.display = 'block';
            if (errorMsg) errorMsg.style.display = 'none';
        } else {
            if (errorMsg) errorMsg.style.display = 'block';
        }
    }

    // ⛰️ 裏ページ遷移
    function goToMystic() {
        currentChapter = 'mystic';
        document.querySelectorAll('.content-section').forEach(sec => {
            sec.style.display = 'none';
            sec.classList.remove('active');
        });
        if (document.getElementById('main-nav')) document.getElementById('main-nav').style.display = 'none';
        if (document.getElementById('section-mystic')) document.getElementById('section-mystic').style.display = 'block';
        
        updateDisplay();
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function returnToMain() {
        if (document.getElementById('section-mystic')) document.getElementById('section-mystic').style.display = 'none';
        if (document.getElementById('main-nav')) document.getElementById('main-nav').style.display = 'flex';
        switchTab('1');
    }

    function checkMysticPassword() {
        const input = document.getElementById('input-mystic') ? document.getElementById('input-mystic').value : '';
        const errorMsg = document.getElementById('error-mystic');

        if (input === configData.mysticPassword) {
            window.location.href = 'mystic.html';
        } else {
            if (errorMsg) errorMsg.style.display = 'block';
        }
    }

    // 🌐 言語切替
    function switchLanguage(lang) {
        currentLang = lang;
        document.documentElement.lang = lang;

        const btnJa = document.getElementById('btn-ja');
        const btnEn = document.getElementById('btn-en');
        if(lang === 'ja') {
            if (btnJa) { btnJa.style.background = 'var(--accent-color)'; btnJa.style.color = 'white'; }
            if (btnEn) { btnEn.style.background = '#111827'; btnEn.style.color = '#9ca3af'; }
        } else {
            if (btnEn) { btnEn.style.background = 'var(--accent-color)'; btnEn.style.color = 'white'; }
            if (btnJa) { btnJa.style.background = '#111827'; btnJa.style.color = '#9ca3af'; }
        }
        updateDisplay();
    }

    // 🚀 初期起動設定
    document.addEventListener('DOMContentLoaded', () => {
        switchLanguage('en');
        switchTab(currentChapter); // ここで最初のエラーを完璧に回避して起動

        // エンターキー設定
        document.querySelectorAll('.password-input').forEach(input => {
            input.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    const section = this.closest('.content-section');
                    if (section) {
                        const num = section.id.replace('section-', '');
                        checkPassword(num);
                    }
                }
            });
        });

        const mysticInput = document.getElementById('input-mystic');
        if(mysticInput) {
            mysticInput.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') checkMysticPassword();
            });
        }
    });
</script>
