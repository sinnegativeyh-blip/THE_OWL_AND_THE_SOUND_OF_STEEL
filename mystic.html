The seeds were kept in a little earth hut behind the home.

Behind the house, built against an earthen wall,
stood round little storehouses made of earth.
Each had an entrance at both ends,
and inside were many jars and pots,
large and small.
They held plant seeds, grains,
pickled vegetables and salted plums,
miso and soy sauce.

In autumn, rice was harvested.
Cotton was gathered and spun into thread.
The ogre worked a loom he had made himself,
using his great hands with surprising care.
Kimono, tabi socks, scarves, hats, gloves—
Whatever was needed,
he made with his own hands.

Why the ogre’s home
was built from wood, earth, and leather—
How such things were made—
How to gather firewood, build a fire,
and keep it from going out—
Without realizing it,
Human learned all of it.

The ogre himself never took baths.
But he knew that townspeople did.
So, beside the house, in a stone-walled space,
he built a bath from stone and earth for Human.
The ogre usually burned fallen branches
and dried pine needles in the hearth.
But for the bath,
he cut fragrant camphor wood
and thinned crowded trees from the forest for firewood.

Human did not have claws like the ogre.
Human could not cut grass, chop wood, or carve things so easily.
So the ogre taught Human how to gather iron sand,
how to make sickles and forge scissors and tools.
And the ogre taught Human how to use them,
and how to care for them too.

From sunrise to sunset,
the ogre and Human worked, talked, and laughed together.
Every day, without fail,
the ogre walked through the field
and checked the little earth storehouses behind the home.
He loved speaking with his friends in the forest.
And he never forgot
that the sky was blue
and the clouds were white.

By then, Human had grown into an adult.
Everything Human knew about living
had been learned from the ogre.
And every day beside the ogre—
every ordinary thing—
felt simply natural.

One day, while gathering firewood lower down the mountain,
Human saw smoke rising in the distance.
Not just one trail of smoke.
There were many,
spreading across the hollow land
like a pale mist.

Could that be—
the town the ogre had spoken of?
Human felt sure of it.

That night, while eating supper,
Human kept thinking.
The ogre and Human each cooked only what they themselves needed,
and each prepared their own meals.
But when they ate,
they always ate together.

At last, Human looked up and said,
“Today, I saw the town.
I think I want to go there.”

The ogre thought quietly for a while.
“I see,” he said at last.
“Then you will go.
But I promised the townspeople
that I would never show myself again.
I cannot go down to the town.
You must go alone.”

Human sat quietly for some time.
Then, with a determined face, said,
“All right.”

On the day Human left for the town,
the ogre came to see Human off.
The goats were there,
and Mother Monkey too.
But somehow—
the ogre’s broad back
looked lonely.

No one knew how much time had passed.
Mother Monkey’s children had children of their own,
and those children grew and raised young as well.
This happened again and again.
And still, the ogre remained
in that small home upon the hill.

Only a few things had changed.
Sometimes, enormous birds crossed the sky
with dreadful roaring sounds.
And now and then, strange noises echoed faintly from far away.
The ogre knew
these were things humans had made.
He could sense that townspeople
had begun coming closer to the mountain.
Careful not to be discovered,
he had started searching for a new place to live.

Then one night—
a beautiful night bright with moonlight—
the ogre returned to the hilltop home
after several days spent looking for a new place.
And suddenly,
he realized something strange.

His home was gone.
Not only the home—
the field, the bamboo grove—
all of it had vanished.

Under the moonlight,
the ogre wandered slowly around.
At last,
he found the crumbling entrance
to one of the little earthen storehouses.
But the home that should have stood nearby was gone.
The field was gone.
The bamboo grove was gone.
There was no sign of the goats.
No sign of the monkeys.
The ogre understood.
The townspeople had come.

“Oh,” he said softly.
“That is good.
I am glad no one saw me.
Tomorrow, early in the morning,
I shall leave.
I will go somewhere new—
somewhere the townspeople will never find me.”

Tired from walking,
the ogre curled up inside the little earth storehouse
and quietly fell asleep.
Moonlight spread beautifully across the land.
Faraway mountains floated like waves in the night.
The earthen walls shimmered softly beneath the moon.
And where the home had once stood—
all that could be seen
were rows and rows of young saplings,
carefully planted in the ground.`

    // 🔄 画面内容の更新処理
    function updateContent() {
        const data = langData[currentLang];
        
        // テキストUIの書き換え
        document.getElementById('header-title').textContent = data.title;
        document.getElementById('header-subtitle').textContent = data.subtitle;
        document.getElementById('back-btn').textContent = data.backBtn;
        document.getElementById('title-video').textContent = data.videoTitle;
        document.getElementById('title-slide').textContent = data.slideTitle;
        document.getElementById('title-story').textContent = data.storyTitle;
        document.getElementById('btn-prev').textContent = data.prevBtn;
        document.getElementById('btn-next').textContent = data.nextBtn;
        document.getElementById('story-text').textContent = data.storyText;
        
        // 動画URLの更新
        const videoUrl = "https://www.youtube.com/embed/" + data.videoCode;
        document.getElementById('mystic-video').src = videoUrl;

        // スライドの更新
        updateSlide();
    }

    // 🖼️ スライド表示の更新
    function updateSlide() {
        if(slideImages.length === 0) return;
        
        // 画像の切り替え
        document.getElementById('slide-img').src = slideImages[currentSlideIndex];
        
        // カウンターの数字の更新 (例: 1 / 15)
        document.getElementById('slide-counter').textContent = 
            (currentSlideIndex + 1) + " / " + slideImages.length;
    }

    // 🕹️ スライドを前後させる処理
    function changeSlide(direction) {
        currentSlideIndex += direction;
        
        // 最初のページの前の場合は最後のページへ、最後の次の場合は最初のページへループ
        if (currentSlideIndex < 0) {
            currentSlideIndex = slideImages.length - 1;
        } else if (currentSlideIndex >= slideImages.length) {
            currentSlideIndex = 0;
        }
        
        updateSlide();
    }

    // 🌐 言語切り替え処理
    function setLanguage(lang) {
        currentLang = lang;
        document.documentElement.lang = lang;
        
        // 言語ボタンの点灯状態の制御
        document.getElementById('btn-ja').classList.remove('active');
        document.getElementById('btn-en').classList.remove('active');
        document.getElementById(`btn-${lang}`).classList.add('active');
        
        updateContent();
    }

    // 🚀 ページ読み込み時の初期動作
    document.addEventListener('DOMContentLoaded', () => {
        setLanguage('ja'); // 最初は日本語に設定
    });
</script>
